name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 3.11 / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tgr01
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: tgr01
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tgr01 -d tgr01"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tgr01:ci-password@localhost:5432/tgr01
      TEST_DATABASE_URL: postgresql+psycopg://tgr01:ci-password@localhost:5432/tgr01_test
      PYTHONUTF8: "1"
      TZ: America/Sao_Paulo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Run deterministic test suite
        run: python -m pytest backend/tests -q

      - name: Run fail-closed chaos checks
        run: python backend/tests/chaos_monkey.py

  desktop:
    name: Node / Vite / Electron
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Build production renderer
        run: npm run build

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libatk-bridge2.0-0 libgbm1 libgtk-3-0 libnss3 xvfb

      - name: Run Electron smoke test
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run --auto-servernum npm run test:electron
